version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: integration
    schedule:
      interval: monthly
